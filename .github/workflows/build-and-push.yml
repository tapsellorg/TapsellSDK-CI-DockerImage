name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/master ]]; then
            echo "IMAGE_TAG=latest" >> "$GITHUB_OUTPUT"
          else
            echo "Error: No valid tag found for the image."
            exit 1
          fi

      - name: Build image
        run: docker build -t tapsellorg/android-sdk:${{ steps.tag.outputs.IMAGE_TAG }} .

      - name: Save image
        run: docker save tapsellorg/android-sdk:${{ steps.tag.outputs.IMAGE_TAG }} -o /tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-image
          path: /tmp/image.tar
          retention-days: 1

  push:
    needs: build
    runs-on: ubuntu-latest
    environment: dockerhub
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: android-sdk-image
          path: /tmp

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Load and push image
        run: |
          docker load -i /tmp/image.tar
          docker push tapsellorg/android-sdk:${{ needs.build.outputs.image_tag }}
